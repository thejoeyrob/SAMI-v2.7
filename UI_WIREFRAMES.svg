<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1580" viewBox="0 0 1280 1580"><rect width="1280" height="1580" fill="#f1f4f2"/><style>text{font-family:Arial,sans-serif;fill:#17251f}.title{font-size:32px;font-weight:700}.h{font-size:21px;font-weight:700}.s{font-size:17px}.tag{font-size:14px;fill:#42614f}</style><text x="40" y="55" class="title">SAMI 2.7.7 · Proposed interface changes</text><text x="40" y="86" class="s">Schematic wireframes · Existing project journey and tools are retained</text><text x="40" y="122" class="h">1. Header and save</text><rect x="40" y="140" width="580" height="166" rx="12" fill="white" stroke="#748c7e"/><text x="60" y="169" class="tag">BEFORE</text><rect x="58" y="185" width="544" height="40" rx="5" fill="#e3eee7"/><text x="70" y="210" class="s">SAMI   Project / Explore / Route / Plan / Create</text><text x="70" y="260" class="s">Saved (small text)                   Menu</text><rect x="660" y="140" width="580" height="166" rx="12" fill="white" stroke="#748c7e"/><text x="680" y="169" class="tag">AFTER</text><rect x="678" y="185" width="544" height="40" rx="5" fill="#e3eee7"/><text x="690" y="210" class="s">SAMI   Same five stages      Backup   Saved</text><text x="690" y="260" class="s">Update available                 Reload / Later</text><text x="40" y="359" class="h">2. Data safety</text><rect x="40" y="377" width="580" height="166" rx="12" fill="white" stroke="#748c7e"/><text x="60" y="406" class="tag">BEFORE</text><rect x="58" y="422" width="544" height="40" rx="5" fill="#e3eee7"/><text x="70" y="447" class="s">Menu → Download project file</text><text x="70" y="497" class="s">Storage problems: temporary toast</text><rect x="660" y="377" width="580" height="166" rx="12" fill="white" stroke="#748c7e"/><text x="680" y="406" class="tag">AFTER</text><rect x="678" y="422" width="544" height="40" rx="5" fill="#e3eee7"/><text x="690" y="447" class="s">Save status • Retry • Export / Import</text><text x="690" y="497" class="s">Backup date • Storage use • Protect storage</text><text x="40" y="596" class="h">3. Precision measurement</text><rect x="40" y="614" width="580" height="166" rx="12" fill="white" stroke="#748c7e"/><text x="60" y="643" class="tag">BEFORE</text><rect x="58" y="659" width="544" height="40" rx="5" fill="#e3eee7"/><text x="70" y="684" class="s">Map + draggable cursor</text><text x="70" y="734" class="s">Distance / Area   Drop / Undo / Add</text><rect x="660" y="614" width="580" height="166" rx="12" fill="white" stroke="#748c7e"/><text x="680" y="643" class="tag">AFTER</text><rect x="678" y="659" width="544" height="40" rx="5" fill="#e3eee7"/><text x="690" y="684" class="s">Map + drag OR tap position OR arrow keys</text><text x="690" y="734" class="s">Coordinates • Bearing • 1m/5m nudges • Drop</text><text x="40" y="833" class="h">4. Field controls / inspector</text><rect x="40" y="851" width="580" height="166" rx="12" fill="white" stroke="#748c7e"/><text x="60" y="880" class="tag">BEFORE</text><rect x="58" y="896" width="544" height="40" rx="5" fill="#e3eee7"/><text x="70" y="921" class="s">Small rail buttons and dense rows</text><text x="70" y="971" class="s">Inspector and drawing panel may overlap</text><rect x="660" y="851" width="580" height="166" rx="12" fill="white" stroke="#748c7e"/><text x="680" y="880" class="tag">AFTER</text><rect x="678" y="896" width="544" height="40" rx="5" fill="#e3eee7"/><text x="690" y="921" class="s">48px map tools • 44px panel actions</text><text x="690" y="971" class="s">Scrollable panel • Restore tools • Safe areas</text><text x="40" y="1070" class="h">5. Appearance / settings</text><rect x="40" y="1088" width="580" height="166" rx="12" fill="white" stroke="#748c7e"/><text x="60" y="1117" class="tag">BEFORE</text><rect x="58" y="1133" width="544" height="40" rx="5" fill="#e3eee7"/><text x="70" y="1158" class="s">13 themes, custom accent, motion</text><text x="70" y="1208" class="s">No system default or wake-lock setting</text><rect x="660" y="1088" width="580" height="166" rx="12" fill="white" stroke="#748c7e"/><text x="680" y="1117" class="tag">AFTER</text><rect x="678" y="1133" width="544" height="40" rx="5" fill="#e3eee7"/><text x="690" y="1158" class="s">13 themes + Follow system + Outdoor contrast</text><text x="690" y="1208" class="s">Keep awake • Active / paused • Data safety</text><text x="40" y="1307" class="h">6. Install and launch</text><rect x="40" y="1325" width="580" height="166" rx="12" fill="white" stroke="#748c7e"/><text x="60" y="1354" class="tag">BEFORE</text><rect x="58" y="1370" width="544" height="40" rx="5" fill="#e3eee7"/><text x="70" y="1395" class="s">Intro runs → generic install help</text><text x="70" y="1445" class="s">First skip hidden; instructions vary by CSS</text><rect x="660" y="1325" width="580" height="166" rx="12" fill="white" stroke="#748c7e"/><text x="680" y="1354" class="tag">AFTER</text><rect x="678" y="1370" width="544" height="40" rx="5" fill="#e3eee7"/><text x="690" y="1395" class="s">Immediate install card • Supported browser steps</text><text x="690" y="1445" class="s">Copy link • Replay • Fast installed repeat entry</text></svg>